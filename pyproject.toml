[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind"
version = "0.1.0"
description = "Open-source, 100% local CPU-first personal 2nd brain and memory backend inspired by MemoMind, Omi, Plaud, and Mem0."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "zhaimingyou", url = "https://github.com/zhaimingyou/EchoMind" }
]
keywords = [
    "ai-wearables",
    "memomind",
    "omi",
    "plaud",
    "second-brain",
    "sherpa-onnx",
    "sensevoice",
    "voiceprint",
    "mcp-server",
    "mem0",
    "smart-glasses"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "watchdog>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
full = [
    "sherpa-onnx>=1.10.0",
    "litellm>=1.40.0",
    "lancedb>=0.10.0",
    "fastmcp>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
